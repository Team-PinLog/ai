name: ai-ci

on:
  # 아래 Validate PR title 은 제목을 이벤트 페이로드에서 읽는다. GitHub 기본 types 는
  # opened·synchronize·reopened 뿐이라 제목만 고치면 새 페이로드가 오지 않고 낡은
  # 실패 판정이 그대로 남는다. 세 번 겪었다 -- 릴리스 PR 의 release(...) 타입,
  # ai#91 의 명사구 규약, 2026-08-04 ai#108. 앞의 둘은 사람이 빈 커밋·문서 커밋을
  # 얹어 synchronize 로 우회했다. ai#108(타 파트 PR)은 제목을 고친 뒤 재실행을 두 번
  # 돌렸는데 둘 다 같은 스텝에서 다시 실패했고 -- 재실행은 저장된 페이로드를 재생하니
  # 옛 제목이 다시 들어온다 -- PR 을 닫았다 여는 것으로 겨우 새 실행을 얻었다.
  # 우회를 아는 사람만 빠져나가는 함정이다.
  #
  # 제목 검사만 별도 워크플로로 빼는 안(러너 비용이 작다)은 택하지 않았다. 필수 상태
  # 검사 이름은 CONTRIBUTING 「PR과 리뷰」의 두 개뿐이고, 그 이름을 바꾸는 순간 열려
  # 있는 PR 이 전부 「필수 검사 없음」이 된다. 본문 편집마다 전체 CI 가 도는 비용은
  # 아래 concurrency 가 이전 실행을 취소해 러너 하나로 수렴한다 -- 제목 검사는 최신
  # 제목으로 도는 것이 맞으므로 여기서는 취소가 의도한 동작이다.
  #
  # types 를 명시하는 순간 기본값 셋이 사라지므로 넷을 다 적는다.
  # test_ci_image_publish_contract.py 가 이 목록을 계약으로 고정한다.
  # search-upgrade 는 검색 고도화 통합 브랜치다(P49 §6) — 작업 PR 의 base 가 dev 가 아니라
  # 이 브랜치라서, 여기 없으면 그 PR 들이 CI 없이 병합된다(T36 계열).
  pull_request:
    types: [opened, synchronize, reopened, edited]
    branches: [main, dev, search-upgrade]
  push:
    branches: [main, dev, search-upgrade]

permissions:
  contents: read

concurrency:
  group: ai-ci-${{ github.workflow }}-${{ github.ref }}
  # PR 피드백은 최신 실행만 남기되, main image publish는 commit별로 순차 완료한다.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    name: ai-ci / check
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      # main 은 배포 브랜치다. 일반 작업이 main 으로 들어가면 dev 가 뒤처지고
      # 다음 릴리스에서 같은 파일이 충돌한다. 2026-07-30 ai#50 이 7 대 1 분기를
      # 만들어 ai#52 로 되돌렸고, 07-31 에 다시 6커밋이 dev 에 없는 상태가 됐다.
      # 두 번 다 사람이 뒤늦게 발견했다 -- CONTRIBUTING 에 적혀 있어도 매번
      # 떠올릴 이유가 없기 때문이다. base 제약은 branch protection 에 기능이
      # 없으므로 여기서 검사한다.
      - name: Validate PR base
        if: github.event_name == 'pull_request' && github.base_ref == 'main'
        env:
          HEAD_REF: ${{ github.head_ref }}
        run: |
          case "$HEAD_REF" in
            release/*|hotfix/*)
              echo "base=main 허용: $HEAD_REF" ;;
            *)
              echo "::error::배포 브랜치를 base 로 하는 PR 은 release/* 또는 hotfix/* 만 허용한다."
              echo "일반 작업은 dev 를 base 로 연다 (CONTRIBUTING.md 「Jira와 Git」)."
              echo "  현재 head: $HEAD_REF"
              echo "  고치는 법: PR 화면에서 base 를 dev 로 바꾸면 된다."
              echo "  main 에만 들어가야 하는 변경이면 브랜치명을 hotfix/ 로 시작하게 한다."
              exit 1 ;;
          esac

      # PR 제목만 검증(squash 병합이라 제목이 최종 커밋 메시지가 된다).
      # 형식 보증이지 티켓 존재 보증은 아니다(수용).
      - name: Validate PR title
        if: github.event_name == 'pull_request'
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          printf '%s\n' "$PR_TITLE" | \
            grep -qE '^(feat|fix|docs|chore|refactor|test|perf|ci)\(S15P11A705-[0-9]+\): ' || \
            { echo "PR 제목 형식: {type}(S15P11A705-N): 설명"; exit 1; }

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies (lock)
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.lock -r requirements-dev.lock ruff

      - name: Lint (ruff)
        run: ruff check .

      - name: Compile check
        run: python -m compileall app tools

      # 2026-07-31 하루에 색인 사고가 다섯 번 났다 -- T 번호 중복 둘, 색인 행 중복,
      # 파일 표 미갱신, 산출물 소실. 대응이 다섯 번 다 "문서에 문장 추가"였고 네 번째는
      # 첫 번째의 대응을 그대로 따랐는데도 났다. 번호를 세는 시점과 병합 시점이 어긋나는
      # 것은 사람이 알 방법이 없기 때문이다. 셀 수 있는 둘만 여기로 옮긴다.
      #
      # 새 잡이 아니라 check 안의 스텝이다. 필수 상태 검사는 두 이름뿐이므로
      # (CONTRIBUTING "PR과 리뷰") 잡을 늘리면 실패해도 병합을 막지 못한다.
      #
      # 테스트보다 앞에 둔다. 파일 시스템만 보는 1초짜리 판정이고, 색인이 어긋난 사실은
      # 테스트 결과와 무관하다. 대신 여기서 끊기면 그 PR 은 테스트 신호를 못 받는다 --
      # 고치고 다시 돌리는 비용보다 Testcontainers 한 판을 아끼는 쪽을 택했다.
      - name: Docs index integrity
        run: python tools/check_docs_index.py

      # 통합 테스트는 Testcontainers로 pgvector를 러너 Docker에 띄운다.
      - name: Tests and app branch coverage
        run: >-
          pytest
          --cov=app
          --cov-branch
          --cov-report=term-missing
          --cov-report=xml:coverage.xml
          --cov-report=json:coverage.json
          --cov-report=html:htmlcov

      # `--cov-fail-under`를 쓰지 않는다. --cov-branch를 켜면 그 값은 statement와 branch를
      # 합산한 하나의 비율이라, statement 수에 가려 branch 미달이 통과한다. 완료 조건은
      # "각각 80% 이상"이므로 둘을 따로 보는 스크립트가 판정한다(S15P11A705-110).
      # 임계값은 스크립트 상수이며 여기서 인자로 덮지 않는다 —
      # test_ci_image_publish_contract.py가 그 사실을 계약으로 고정한다.
      - name: Coverage gate (app line·branch >= 80% each)
        run: python tools/check_coverage_gate.py

      # 게이트 실패 시에도 리포트는 남겨야 어디가 비었는지 볼 수 있다.
      - name: Upload app coverage report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ai-app-coverage-${{ github.run_id }}
          path: |
            coverage.xml
            coverage.json
            htmlcov/
          if-no-files-found: error
          retention-days: 7

      - name: Set up Docker Buildx for PR image validation
        if: github.event_name == 'pull_request'
        uses: docker/setup-buildx-action@e468171a9de216ec08956ac3ada2f0791b6bd435 # v3.11.1

      - name: Validate AI container image
        if: github.event_name == 'pull_request'
        uses: docker/build-push-action@263435318d21b8e681c14492fe198d362a7d2c83 # v6.18.0
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          push: false

  # BD-39 는 Embedding Profile 정본을 back 의 application.yml 리터럴로 두기로 했고,
  # "두 값이 같다"를 지켜야 할 명제로 명시했다. back#98 리뷰가 그 명제를 지키는 장치가
  # 사람의 눈뿐이라고 지적했다 — 이 잡이 그 대조를 기계로 옮긴다.
  #
  # check 와 독립으로 돌린다. 순차로 묶으면 테스트가 깨진 PR 에서 계약 드리프트가
  # 보이지 않고, 이 잡의 네트워크 실패가 테스트 신호를 가리지도 않는다.
  embedding-profile-parity:
    name: ai-ci / embedding profile parity
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies (lock)
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.lock

      # back 은 public 저장소라 raw endpoint 를 무인증으로 읽는다. 토큰을 주지 않는 것이
      # 경계다 — 주면 이 잡이 타 레포 접근 권한을 상시로 들고 다니게 된다.
      - name: Compare embedding profile literals across repositories
        env:
          PYTHONIOENCODING: utf-8
        run: python tools/check_embedding_profile_parity.py

  # check 는 main·dev 양쪽에서 돌지만 publish 는 main 전용이다.
  # infra 의 ai-image-update.yaml 이 `test "$SOURCE_BRANCH" = main` 으로 어서션하므로
  # 이 조건을 dev 로 넓히면 GitOps 반영이 거부된다.
  image-publish:
    name: ai-image / publish
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    env:
      SOURCE_REPOSITORY: Team-PinLog/ai
      SOURCE_SHA: ${{ github.sha }}
      IMAGE: ghcr.io/team-pinlog/ai
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          ref: ${{ github.sha }}

      - name: Validate exact source commit
        shell: bash
        run: |
          set -euo pipefail
          [[ "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"

      - uses: docker/setup-buildx-action@e468171a9de216ec08956ac3ada2f0791b6bd435 # v3.11.1

      - name: Log in to GHCR
        uses: docker/login-action@74a5d142397b4f367a81961eba4e8cd7edddf772 # v3.4.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Refuse to overwrite existing commit tag
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          registry_token=$(curl --fail --silent --show-error \
            --user "${GITHUB_ACTOR}:${GITHUB_TOKEN}" \
            --get \
            --data-urlencode 'service=ghcr.io' \
            --data-urlencode 'scope=repository:team-pinlog/ai:pull,push' \
            'https://ghcr.io/token' | jq -er '.token')

          set +e
          http_status=$(curl --silent --show-error \
            --output /dev/null \
            --write-out '%{http_code}' \
            --head \
            --header "Authorization: Bearer ${registry_token}" \
            --header 'Accept: application/vnd.oci.image.index.v1+json, application/vnd.docker.distribution.manifest.list.v2+json, application/vnd.oci.image.manifest.v1+json, application/vnd.docker.distribution.manifest.v2+json' \
            "https://ghcr.io/v2/team-pinlog/ai/manifests/${SOURCE_SHA}")
          curl_status=$?
          set -e

          if [ "$curl_status" -ne 0 ]; then
            echo "::error::Registry preflight request failed"
            exit 1
          fi
          case "$http_status" in
            404)
              echo "Commit tag is available"
              ;;
            200)
              echo "::error::Commit tag already exists; refusing to overwrite ${IMAGE}:${SOURCE_SHA}"
              exit 1
              ;;
            *)
              echo "::error::Registry preflight returned unexpected HTTP ${http_status}"
              exit 1
              ;;
          esac

      - name: Build and publish immutable AI image
        id: publish
        uses: docker/build-push-action@263435318d21b8e681c14492fe198d362a7d2c83 # v6.18.0
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          push: true
          tags: ghcr.io/team-pinlog/ai:${{ github.sha }}

      - name: Verify published image digest
        shell: bash
        env:
          IMAGE_DIGEST: ${{ steps.publish.outputs.digest }}
        run: |
          set -euo pipefail
          [[ "$IMAGE_DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]
          REGISTRY_DIGEST=$(docker buildx imagetools inspect "${IMAGE}:${SOURCE_SHA}" \
            --format '{{.Manifest.Digest}}')
          [[ "$REGISTRY_DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]
          test "$REGISTRY_DIGEST" = "$IMAGE_DIGEST"
          docker buildx imagetools inspect "ghcr.io/team-pinlog/ai:${SOURCE_SHA}@${IMAGE_DIGEST}"
          echo "Published digest: $IMAGE_DIGEST"

      - name: Create verified image provenance
        shell: bash
        env:
          IMAGE_DIGEST: ${{ steps.publish.outputs.digest }}
        run: |
          set -euo pipefail
          umask 077
          [[ "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$IMAGE_DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]
          test "$SOURCE_REPOSITORY" = "Team-PinLog/ai"
          test "$IMAGE" = "ghcr.io/team-pinlog/ai"

          temporary=$(mktemp)
          trap 'rm -f "$temporary"' EXIT
          jq -n \
            --arg source_repository "$SOURCE_REPOSITORY" \
            --arg source_sha "$SOURCE_SHA" \
            --arg image_repository "$IMAGE" \
            --arg digest "$IMAGE_DIGEST" \
            '{source_repository: $source_repository, source_sha: $source_sha, image_repository: $image_repository, digest: $digest}' \
            > "$temporary"
          jq -e 'type == "object" and (keys | sort) == ["digest", "image_repository", "source_repository", "source_sha"]' "$temporary" >/dev/null
          test "$(jq -er '.source_repository' "$temporary")" = "$SOURCE_REPOSITORY"
          test "$(jq -er '.source_sha' "$temporary")" = "$SOURCE_SHA"
          test "$(jq -er '.image_repository' "$temporary")" = "$IMAGE"
          test "$(jq -er '.digest' "$temporary")" = "$IMAGE_DIGEST"
          mv "$temporary" provenance.json

      - name: Upload verified image provenance
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ai-image-provenance
          path: provenance.json
          if-no-files-found: error
          retention-days: 7

      - name: Request trusted Infra AI image promotion
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.PINLOG_INFRA_IMAGE_PR_TOKEN }}
        run: |
          set -euo pipefail
          test -n "$GH_TOKEN"
          gh workflow run ai-image-update.yaml \
            --repo Team-PinLog/infra \
            --ref main
