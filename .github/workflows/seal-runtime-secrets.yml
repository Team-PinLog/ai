name: seal-runtime-secrets

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  seal:
    name: seal / ai-dev
    runs-on: ubuntu-latest
    environment: pinlog-secrets-dev
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          ref: ${{ github.sha }}
      - name: Seal runtime Secrets and open the Infra PR
        uses: Team-PinLog/infra/.github/actions/sealedsecret-infra-pr@16bfae0da4e1091df597fb89f6acf914391e11b9
        env:
          GMS_API_KEY: ${{ secrets.GMS_API_KEY }}
          GMS_BASE_URL: ${{ secrets.GMS_BASE_URL }}
          INTERNAL_SHARED_SECRET: ${{ secrets.INTERNAL_SHARED_SECRET }}
          PINLOG_INFRA_SECRET_PR_TOKEN: ${{ secrets.PINLOG_INFRA_IMAGE_PR_TOKEN }}
        with:
          policy: ai-dev
          revision: ${{ github.sha }}
