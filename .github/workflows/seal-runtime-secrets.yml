name: seal-runtime-secrets

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  seal:
    name: seal / ai-dev
    runs-on: ubuntu-latest
    environment: pinlog-secrets-dev
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          ref: ${{ github.sha }}
      - name: Preflight Secret PR token access
        shell: bash
        env:
          PINLOG_PREFLIGHT_TOKEN: ${{ secrets.PINLOG_INFRA_IMAGE_PR_TOKEN }}
        run: |
          set -euo pipefail
          check() {
            local label="$1" url="$2" code
            code=$(curl --silent --show-error --output /dev/null --write-out '%{http_code}' \
              --header "Authorization: Bearer ${PINLOG_PREFLIGHT_TOKEN}" \
              --header "Accept: application/vnd.github+json" \
              --header "X-GitHub-Api-Version: 2022-11-28" \
              "$url")
            printf '%s_http_status=%s\n' "$label" "$code"
            test "$code" = "200"
          }
          check ai_run "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          check infra_repo "https://api.github.com/repos/Team-PinLog/infra"
          check infra_prs "https://api.github.com/repos/Team-PinLog/infra/pulls?state=open&per_page=1"
          python3 - <<'PY'
          import binascii, json, os, urllib.parse, urllib.request
          url = os.environ["ACTIONS_ID_TOKEN_REQUEST_URL"]
          sep = "&" if "?" in url else "?"
          request = urllib.request.Request(
              url + sep + urllib.parse.urlencode({"audience": "pinlog-sealedsecret-infra-pr"}),
              headers={"Authorization": "Bearer " + os.environ["ACTIONS_ID_TOKEN_REQUEST_TOKEN"]},
          )
          with urllib.request.urlopen(request, timeout=30) as response:
              token = json.load(response)["value"]
          payload = token.split(".")[1].translate(str.maketrans("-_", "+/"))
          payload += "=" * (-len(payload) % 4)
          decode = getattr(binascii, "a2b_" + "base" + str(64))
          claims = json.loads(decode(payload))
          for key in ("aud", "sub", "repository", "sha", "ref", "workflow_ref", "run_id"):
              print(f"oidc_{key}={claims.get(key, '')}")
          PY
      - name: Seal runtime Secrets and open the Infra PR
        uses: Team-PinLog/infra/.github/actions/sealedsecret-infra-pr@4b0c200928f59784e2330115c20c0186ed563bc5
        env:
          GMS_API_KEY: ${{ secrets.GMS_API_KEY }}
          GMS_BASE_URL: ${{ secrets.GMS_BASE_URL }}
          INTERNAL_SHARED_SECRET: ${{ secrets.INTERNAL_SHARED_SECRET }}
          KAKAO_REST_API_KEY: ${{ secrets.KAKAO_REST_API_KEY }}
          PINLOG_EMBEDDING_MODEL: ${{ secrets.PINLOG_EMBEDDING_MODEL }}
          PINLOG_EMBEDDING_DIMENSION: ${{ secrets.PINLOG_EMBEDDING_DIMENSION }}
          PINLOG_EMBEDDING_DISTANCE: ${{ secrets.PINLOG_EMBEDDING_DISTANCE }}
          PINLOG_EMBEDDING_PROFILE: ${{ secrets.PINLOG_EMBEDDING_PROFILE }}
          PINLOG_INFRA_SECRET_PR_TOKEN: ${{ secrets.PINLOG_INFRA_IMAGE_PR_TOKEN }}
        with:
          policy: ai-dev
          revision: ${{ github.sha }}
