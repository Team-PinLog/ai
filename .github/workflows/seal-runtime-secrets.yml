name: seal-runtime-secrets

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  seal:
    name: seal / ai-dev
    runs-on: ubuntu-latest
    environment: pinlog-secrets-dev
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          ref: ${{ github.sha }}
      - name: Preflight Secret PR token access
        shell: bash
        env:
          PINLOG_PREFLIGHT_TOKEN: ${{ secrets.PINLOG_INFRA_IMAGE_PR_TOKEN }}
        run: |
          set -euo pipefail
          check() {
            local label="$1" url="$2" code
            code=$(curl --silent --show-error --output /dev/null --write-out '%{http_code}' \
              --header "Authorization: Bearer ${PINLOG_PREFLIGHT_TOKEN}" \
              --header "Accept: application/vnd.github+json" \
              --header "X-GitHub-Api-Version: 2022-11-28" \
              "$url")
            printf '%s_http_status=%s\n' "$label" "$code"
            test "$code" = "200"
          }
          check ai_run "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          check infra_repo "https://api.github.com/repos/Team-PinLog/infra"
          check infra_prs "https://api.github.com/repos/Team-PinLog/infra/pulls?state=open&per_page=1"
      - name: Seal runtime Secrets and open the Infra PR
        uses: Team-PinLog/infra/.github/actions/sealedsecret-infra-pr@16bfae0da4e1091df597fb89f6acf914391e11b9
        env:
          GMS_API_KEY: ${{ secrets.GMS_API_KEY }}
          GMS_BASE_URL: ${{ secrets.GMS_BASE_URL }}
          INTERNAL_SHARED_SECRET: ${{ secrets.INTERNAL_SHARED_SECRET }}
          PINLOG_INFRA_SECRET_PR_TOKEN: ${{ secrets.PINLOG_INFRA_IMAGE_PR_TOKEN }}
        with:
          policy: ai-dev
          revision: ${{ github.sha }}
