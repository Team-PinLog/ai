name: seal-ai-secrets

# AI owner 소유 Secret을 SealedSecret으로 봉인해 Infra에 넘긴다.
#
# 왜 이 workflow가 필요한가:
#   GitHub Actions Secret은 Kubernetes Pod에 자동으로 전달되지 않는다. 값을 클러스터까지
#   보내려면 누군가 한 번은 평문을 만져야 하는데, Infra는 "값을 열람하지 않은 채 배포"를
#   요구했다(ai#32). SealedSecret은 공개키로 암호화한 manifest만 넘기므로 그 요구를 만족한다.
#
# 무엇을 절대 하지 않는가:
#   - 평문 Secret YAML을 파일로 쓰지 않는다. kubeseal --raw 로 값 하나씩 암호화해
#     암호문만 조립한다(kubectl create secret --dry-run 경로는 중간에 평문 base64 YAML을 만든다).
#   - cluster credential을 쓰지 않는다. 이 레포에 kubeconfig가 없고 kubectl apply 도 하지 않는다.
#   - set -x 를 켜지 않는다. 켜면 셸이 확장된 값을 그대로 로그에 찍는다.
#
# 트리거는 수동뿐이다. Secret 회전은 사람이 결정하는 사건이고, push마다 돌 이유가 없다.

on:
  workflow_dispatch:
    inputs:
      namespace:
        description: 대상 네임스페이스 (SealedSecret은 scope=strict라 이름·네임스페이스가 암호문에 묶인다)
        required: true
        default: pinlog-dev
      name:
        description: Secret 리소스 이름
        required: true
        default: ai-owner-secrets

permissions:
  contents: read

concurrency:
  # 같은 Secret을 동시에 두 번 봉인하면 어느 artifact가 최신인지 알 수 없다.
  group: seal-ai-secrets
  cancel-in-progress: false

env:
  KUBESEAL_VERSION: "0.27.1"
  CERT_PATH: deploy/sealed-secrets/pinlog-dev-cert.pem
  # ai#32에서 Infra가 제공한 controller 인증서의 지문. 인증서가 교체되면 여기서 멈춘다 —
  # 엉뚱한 공개키로 봉인하면 controller가 복호화하지 못하고, 그 실패는 배포 시점에야 드러난다.
  CERT_FINGERPRINT: "4A:C5:18:6C:57:94:76:F6:AA:E5:1C:C4:53:9D:4F:11:BB:C1:8F:3E:DF:8B:81:B8:1F:5E:A9:68:1C:5B:C6:A2"

jobs:
  seal:
    name: seal / ai-owner-secrets
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      # 값이 비어 있으면 봉인은 성공하고 배포가 401 또는 기동 실패로 죽는다. 여기서 멈추는 편이 낫다.
      #
      # EMBEDDING 넷은 비밀이 아니다(모델명·차원·거리함수·프로필 식별자이고 정본은 공개 문서 P32에
      # 있다). 그래도 Secret 경로로 다루는 것은 Infra 가 주입 경로를 하나로 요구했기 때문이며,
      # 값이 공개라는 사실과 "어디서 주입되는가"는 별개다. 앱은 이 넷에 기본값을 두지 않으므로
      # (app/core/config.py) 누락되면 Pod 이 아예 뜨지 않는다.
      - name: Verify secrets are present
        env:
          GMS_BASE_URL: ${{ secrets.GMS_BASE_URL }}
          GMS_API_KEY: ${{ secrets.GMS_API_KEY }}
          INTERNAL_SHARED_SECRET: ${{ secrets.INTERNAL_SHARED_SECRET }}
          PINLOG_EMBEDDING_MODEL: ${{ secrets.PINLOG_EMBEDDING_MODEL }}
          PINLOG_EMBEDDING_DIMENSION: ${{ secrets.PINLOG_EMBEDDING_DIMENSION }}
          PINLOG_EMBEDDING_DISTANCE: ${{ secrets.PINLOG_EMBEDDING_DISTANCE }}
          PINLOG_EMBEDDING_PROFILE: ${{ secrets.PINLOG_EMBEDDING_PROFILE }}
        run: |
          set -euo pipefail
          missing=""
          for key in GMS_BASE_URL GMS_API_KEY INTERNAL_SHARED_SECRET \
                     PINLOG_EMBEDDING_MODEL PINLOG_EMBEDDING_DIMENSION \
                     PINLOG_EMBEDDING_DISTANCE PINLOG_EMBEDDING_PROFILE; do
            eval "value=\${$key}"
            [ -n "${value}" ] || missing="${missing} ${key}"
          done
          if [ -n "${missing}" ]; then
            echo "::error::등록되지 않은 Actions Secret:${missing}"
            echo "Settings → Secrets and variables → Actions 에서 등록하라. 값은 여기 출력되지 않는다."
            exit 1
          fi

          # 앱이 기동 시 fail-fast 로 거르는 것과 같은 검사를 여기서 미리 한다. 그러지 않으면
          # 배포하고 Pod 이 죽어야 알게 된다. 비밀 값은 찍지 않고, 공개 값만 오류 메시지에 넣는다.
          case "${GMS_BASE_URL}" in
            *"/gmsapi/"*) ;;
            *) echo "::error::GMS_BASE_URL 에 /gmsapi/ 가 없다. embedding·judge 양쪽이 이 형식을 요구한다"; exit 1 ;;
          esac
          case "${PINLOG_EMBEDDING_DIMENSION}" in
            ''|*[!0-9]*) echo "::error::PINLOG_EMBEDDING_DIMENSION 이 정수가 아니다: ${PINLOG_EMBEDDING_DIMENSION}"; exit 1 ;;
          esac
          # app/core/config.py 의 profile 정합 검사와 같은 규칙 — profile 문자열이 나머지 셋을
          # 부분 문자열로 포함해야 한다. 어긋난 채 배포하면 기존 임베딩이 전부 조회 대상에서 빠진다.
          for token in "${PINLOG_EMBEDDING_MODEL}" "${PINLOG_EMBEDDING_DIMENSION}" "${PINLOG_EMBEDDING_DISTANCE}"; do
            case "${PINLOG_EMBEDDING_PROFILE}" in
              *"${token}"*) ;;
              *) echo "::error::PINLOG_EMBEDDING_PROFILE 에 '${token}' 이 없다 (앱의 profile 정합 검사와 같은 규칙)"; exit 1 ;;
            esac
          done
          echo "일곱 값 모두 존재하고 형식이 맞다."

      - name: Verify controller certificate
        run: |
          set -euo pipefail
          actual="$(openssl x509 -in "${CERT_PATH}" -noout -fingerprint -sha256 \
            | sed 's/^.*Fingerprint=//')"
          if [ "${actual}" != "${CERT_FINGERPRINT}" ]; then
            echo "::error::인증서 지문이 다르다. Infra가 controller 키를 교체했는지 확인하라"
            echo "expected ${CERT_FINGERPRINT}"
            echo "actual   ${actual}"
            exit 1
          fi
          # 만료된 인증서로 봉인하면 controller 가 거부한다.
          openssl x509 -in "${CERT_PATH}" -noout -checkend 0
          echo "지문 일치. 유효기간 내."

      - name: Install kubeseal
        run: |
          set -euo pipefail
          base="https://github.com/bitnami-labs/sealed-secrets/releases/download/v${KUBESEAL_VERSION}"
          curl -fsSL -o kubeseal.tar.gz "${base}/kubeseal-${KUBESEAL_VERSION}-linux-amd64.tar.gz"
          curl -fsSL -o checksums.txt "${base}/sealed-secrets_${KUBESEAL_VERSION}_checksums.txt"
          # 릴리스가 함께 배포하는 체크섬으로 검증한다. 바이너리를 그대로 믿지 않는다.
          grep "kubeseal-${KUBESEAL_VERSION}-linux-amd64.tar.gz" checksums.txt | sha256sum -c -
          tar xzf kubeseal.tar.gz kubeseal
          chmod +x kubeseal
          ./kubeseal --version

      # 핵심 단계. --raw 는 값 하나를 받아 암호문 한 줄을 돌려준다. 평문은 파이프 안에만
      # 존재하고 파일·인자·로그 어디에도 남지 않는다(변수 확장은 셸 내부에서 끝나므로
      # ps 로도 보이지 않는다).
      - name: Seal
        env:
          GMS_BASE_URL: ${{ secrets.GMS_BASE_URL }}
          GMS_API_KEY: ${{ secrets.GMS_API_KEY }}
          INTERNAL_SHARED_SECRET: ${{ secrets.INTERNAL_SHARED_SECRET }}
          PINLOG_EMBEDDING_MODEL: ${{ secrets.PINLOG_EMBEDDING_MODEL }}
          PINLOG_EMBEDDING_DIMENSION: ${{ secrets.PINLOG_EMBEDDING_DIMENSION }}
          PINLOG_EMBEDDING_DISTANCE: ${{ secrets.PINLOG_EMBEDDING_DISTANCE }}
          PINLOG_EMBEDDING_PROFILE: ${{ secrets.PINLOG_EMBEDDING_PROFILE }}
          NS: ${{ inputs.namespace }}
          NAME: ${{ inputs.name }}
        run: |
          set -euo pipefail
          seal_one() {
            printf '%s' "$1" | ./kubeseal --raw \
              --scope strict --namespace "${NS}" --name "${NAME}" --cert "${CERT_PATH}"
          }

          enc_base_url="$(seal_one "${GMS_BASE_URL}")"
          enc_api_key="$(seal_one "${GMS_API_KEY}")"
          enc_internal="$(seal_one "${INTERNAL_SHARED_SECRET}")"
          enc_emb_model="$(seal_one "${PINLOG_EMBEDDING_MODEL}")"
          enc_emb_dimension="$(seal_one "${PINLOG_EMBEDDING_DIMENSION}")"
          enc_emb_distance="$(seal_one "${PINLOG_EMBEDDING_DISTANCE}")"
          enc_emb_profile="$(seal_one "${PINLOG_EMBEDDING_PROFILE}")"

          mkdir -p out
          # heredoc 을 쓰지 않는다. 이 스크립트는 YAML 블록 스칼라(run: |) 안이라 들여쓰기가
          # 곧 블록의 경계다 — heredoc 본문을 왼쪽 끝에 붙이면 workflow YAML 자체가 끊기고,
          # 들여쓴 채 두면 그 공백이 산출 파일에 그대로 들어가 SealedSecret 이 깨진다.
          # echo 로 조립하면 들여쓰기가 문자열 안에 있어 둘 다 피한다.
          {
            echo "# 생성: seal-ai-secrets workflow (run ${GITHUB_RUN_ID}, commit ${GITHUB_SHA})"
            echo "# scope=strict — 이 name/namespace 조합에서만 복호화된다. 옮겨 쓰려면 다시 봉인해야 한다."
            echo "apiVersion: bitnami.com/v1alpha1"
            echo "kind: SealedSecret"
            echo "metadata:"
            echo "  name: ${NAME}"
            echo "  namespace: ${NS}"
            echo "spec:"
            echo "  encryptedData:"
            echo "    GMS_BASE_URL: ${enc_base_url}"
            echo "    GMS_API_KEY: ${enc_api_key}"
            echo "    INTERNAL_SHARED_SECRET: ${enc_internal}"
            echo "    PINLOG_EMBEDDING_MODEL: ${enc_emb_model}"
            echo "    PINLOG_EMBEDDING_DIMENSION: ${enc_emb_dimension}"
            echo "    PINLOG_EMBEDDING_DISTANCE: ${enc_emb_distance}"
            echo "    PINLOG_EMBEDDING_PROFILE: ${enc_emb_profile}"
            echo "  template:"
            echo "    metadata:"
            echo "      name: ${NAME}"
            echo "      namespace: ${NS}"
            echo "    type: Opaque"
          } > out/ai-owner-secrets.sealed.yaml

          # 산출물 검증 — 두 방향으로 본다.
          #
          # (1) 모든 encryptedData 값이 실제 암호문인가.
          #     kubeseal 출력은 "Ag" 로 시작하는 긴 base64 다. 봉인이 빈 문자열이나 평문을
          #     흘렸다면 여기서 걸린다. 아래 (2)보다 이쪽이 판정력이 높다.
          while IFS= read -r line; do
            enc="${line##*: }"
            case "${enc}" in
              Ag*) ;;
              *) echo "::error::암호문 형식이 아닌 항목이 있다: ${line%%:*}"; rm -f out/ai-owner-secrets.sealed.yaml; exit 1 ;;
            esac
            if [ "${#enc}" -lt 100 ]; then
              echo "::error::암호문이 지나치게 짧다: ${line%%:*} (${#enc}자)"
              rm -f out/ai-owner-secrets.sealed.yaml
              exit 1
            fi
          done < <(sed -n '/^  encryptedData:/,/^  template:/p' out/ai-owner-secrets.sealed.yaml | grep '^    [A-Z]')

          # (2) 평문이 그대로 새지 않았는가.
          #     짧은 값(1536·cosine 등)은 base64 암호문에 우연히 포함될 수 있어 거짓 양성을
          #     만든다. 그 길이대는 (1)이 이미 덮으므로 12자 이상만 본다.
          for value in "${GMS_BASE_URL}" "${GMS_API_KEY}" "${INTERNAL_SHARED_SECRET}" \
                       "${PINLOG_EMBEDDING_MODEL}" "${PINLOG_EMBEDDING_PROFILE}"; do
            [ "${#value}" -ge 12 ] || continue
            if grep -qF -- "${value}" out/ai-owner-secrets.sealed.yaml; then
              echo "::error::산출물에 평문이 포함됐다. 업로드하지 않고 중단한다"
              rm -f out/ai-owner-secrets.sealed.yaml
              exit 1
            fi
          done
          echo "봉인 완료. 암호문 7건 형식 확인, 평문 미포함 확인."

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ai-owner-secrets-sealed
          path: out/ai-owner-secrets.sealed.yaml
          # Infra가 받아 가면 끝나는 산출물이다. 암호문이라도 오래 둘 이유가 없다.
          retention-days: 7
          if-no-files-found: error

      - name: Summary
        env:
          NS: ${{ inputs.namespace }}
          NAME: ${{ inputs.name }}
        run: |
          {
            echo "## SealedSecret 산출 완료"
            echo
            echo "| | |"
            echo "|---|---|"
            echo "| 대상 | \`${NS}/${NAME}\` |"
            echo "| scope | strict |"
            echo "| 키 | \`GMS_BASE_URL\` · \`GMS_API_KEY\` · \`INTERNAL_SHARED_SECRET\` · \`PINLOG_EMBEDDING_MODEL\` · \`PINLOG_EMBEDDING_DIMENSION\` · \`PINLOG_EMBEDDING_DISTANCE\` · \`PINLOG_EMBEDDING_PROFILE\` |"
            echo "| artifact | \`ai-owner-secrets-sealed\` (7일) |"
            echo
            echo "artifact를 받아 GitOps 레포에 넣고 적용하면 된다. 평문은 이 실행 어디에도 없다."
          } >> "${GITHUB_STEP_SUMMARY}"
