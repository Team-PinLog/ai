# 검증 질의 12건 × 반환 Record 142행의 적합성 라벨.
#
# **기대 정답은 `demo_data.yaml` 이 이미 정했다**(`expect`). 그것만으로는 「꼬리를 얼마나
# 잘랐나」를 셀 수 없다 — 정답이 아닌 141행이 전부 잡음인지, 그중 일부는 사용자가 봐도
# 납득할 결과인지가 갈리지 않기 때문이다. 컷의 이득을 「정답 아닌 것의 제거」로 세면
# **이득이 부풀고** 컷을 과하게 잡게 된다.
#
# 그래서 정답 아닌 행에만 라벨을 붙인다. `tools/tau_grid/labels.yaml` 이 τ 에서 한 것과
# 같은 이유이며, 저쪽의 `unclear` 에 해당하는 것이 여기의 `plausible` 이다.
#
# ## 판정 기준
#
#   hit         `demo_data.yaml` 의 `expect`. **이 파일에 적지 않는다** — matrix.json 이
#               `is_expected` 로 들고 있고, 손으로 옮기면 둘이 갈라진다
#   plausible   기대 Record 는 아니지만 **질의가 요구한 성질 중 하나 이상을 본문이 실제로
#               말한다.** 사용자가 결과로 보면 「이것도 맞다」고 할 여지가 있다
#   irrelevant  본문이 질의의 어느 성질도 말하지 않는다. 장소 종류·통념에서 온 연상뿐이다
#
# **여기 적힌 것만 `plausible` 이고 나머지는 전부 `irrelevant` 다.** 전량을 나열하지 않는
# 이유는 검토 가능성이다 — 142행을 적으면 아무도 다시 읽지 않는다.
#
# ## plausible 을 왜 따로 두는가
#
# irrelevant 로 밀면 컷의 이득이 부풀고, hit 쪽으로 밀면 손실이 부푼다. 따로 세고
# **비관(irrelevant 만 이득으로 인정)·낙관(plausible 도 잡음으로 인정) 양쪽을 함께**
# 보고한다(`sweep.py` 의 `tail_strict` · `tail_loose`).
#
# ## 판정을 넉넉히 잡았다
#
# 「자주 갔던 곳」·「단골집」처럼 질의가 **장소 종류가 아닌 관계**를 묻는 경우, 그 관계를
# 본문이 말하는 Record 는 종류가 달라도 plausible 로 뒀다(예: 「돈카츠 먹으러 자주 갔던 곳」
# 에 대해 「신한 부캠 때 거의 일주일마다 가던」 플랜트 연남점). **컷의 이득을 과대평가하지
# 않는 방향**이며, 이 라벨로도 컷이 이득이면 더 엄격한 라벨에서도 이득이다.
#
# ## 이 라벨의 한계
#
# 판정자는 이 티켓의 작업자 한 명이고 교차 검증이 없다. 질의 12건과 기대값도 우리가
# 작성한 것이다(`-174` §3.3). **재현되는 것은 「의도한 매칭」이지 사용자 만족도가 아니다.**
#
# record_id 는 2026-07-31 시점 `pinlog-demo`(:15432) 기준이다. 재시딩하면 바뀐다 —
# 그때는 `matrix.py` 를 다시 돌리고 이 파일을 본문 기준으로 다시 맞춰야 한다.
# `sweep.py` 는 여기 적힌 record_id 가 그 질의의 결과에 없으면 **재지 않고 멈춘다.**

meta:
  matrix: ".search/matrix.json"
  measured_at: "2026-07-31"
  db: "pinlog-demo :15432 · Record 42건 · 질의 12건 · 반환 142행"

# 질의는 `demo_data.yaml` 의 `query` 문자열로 잇는다. 없는 질의를 적으면 sweep.py 가 멈춘다.
queries:
  - query: "비 오는 날 가려고 저장한 곳"
    plausible: []          # 「비」를 말하는 본문은 기대 Record 하나뿐이다

  - query: "혼자 조용히 작업하기 좋은 카페"
    plausible:
      - 252   # 골목 안 다방 — 「빗소리 들으면서 앉아 있기 아늑」. 조용·아늑 축이 부합한다

  - query: "친구들이랑 시끌벅적하게 놀 만한 곳"
    plausible:
      - 256   # 넓은 한상 식당 — 「자리가 넓어서」·「대화하기도 좋았다」. 동행·대화 축이 부합한다

  - query: "기념일에 야경 보면서 식사할 곳"
    plausible: []          # 「야경」·「기념일」·「식사」 셋 중 어느 것도 다른 본문에 없다

  - query: "돈카츠 먹으러 자주 갔던 곳"
    plausible:
      - 281   # 플랜트 연남점 — 「거의 일주일마다 가던」. 「자주 갔던」 축이 부합한다
      - 278   # 감나무집기사식당 — 「신한 부캠 때 자주갔음」
      - 284   # 진우네 초밥 — 「자주 가던 일식집」
      - 283   # 쿠로코식당 연남점 — 「자주 가던 라멘집」

  - query: "미슐랭에 오른 라멘집"
    plausible:
      - 283   # 쿠로코식당 연남점 — 라멘집이다. 미슐랭은 아니다

  - query: "친구들이랑 피자에 맥주 마신 곳"
    plausible:
      - 277   # 카츠요 — 「친구들과 자주 먹었던」. 「친구들이랑」 축이 부합한다

  - query: "밥 먹고 산책하면서 쉬어가는 공원"
    plausible:
      - 282   # 치킨버거 이스트사이드 — 「이거 사들고 그네 공원 갔음」. 공원을 실제로 말한다

  - query: "채식 샌드위치 먹던 단골집"
    plausible:
      - 277   # 카츠요 — 「자주 먹었던」. 「단골」 축이 부합한다(채식은 정반대다)
      - 278   # 감나무집기사식당 — 「자주갔음」
      - 284   # 진우네 초밥 — 「자주 가던」
      - 283   # 쿠로코식당 연남점 — 「자주 가던」

  - query: "책 사면 꽃을 주는 서점"
    plausible: []          # gahyeon 의 나머지 10건은 전부 음식점·카페다

  - query: "화덕에 구운 피자집"
    plausible: []          # 피자를 말하는 본문은 기대 Record 하나뿐이다

  - query: "양갱 파는 분위기 좋은 카페"
    plausible:
      - 275   # 힉스커피 — 「디저트랑 인테리어 이쁨」. 「분위기 좋은 카페」 축이 부합한다
      - 271   # 피넛커피 — 「소파가 아주 편했다는 소문」. 분위기 축이 부합한다
      - 266   # 도피 — 「브런치 카페」. 카페 범주만 부합한다(경계에 가장 가까운 판정이다)
