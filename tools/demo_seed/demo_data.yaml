# 시연에서 실행할 검색 질의. verify.py가 이 목록으로 검색 품질을 확인한다.
# `expect`는 위 records의 key다.
# `as`는 검색 주체 member key다 — 생략하면 host. 검색은 userId로 갈리므로
# 다른 사람의 Record를 기대값으로 두려면 반드시 지정해야 한다.
demo_queries:
  - query: "비 오는 날 가려고 저장한 곳"
    expect: rain
  - query: "혼자 조용히 작업하기 좋은 카페"
    expect: work
  - query: "친구들이랑 시끌벅적하게 놀 만한 곳"
    expect: drink
  - query: "기념일에 야경 보면서 식사할 곳"
    expect: view

  # ── 실데이터 질의 (2026-07-30). 검색 주체가 host 가 아니므로 `as` 가 필수다.
  - query: "돈카츠 먹으러 자주 갔던 곳"
    expect: katsuyo
    as: jeongheon
  - query: "미슐랭에 오른 라멘집"
    expect: sarukame
    as: jeongheon
  - query: "친구들이랑 피자에 맥주 마신 곳"
    expect: neworder
    as: jeongheon
  - query: "밥 먹고 산책하면서 쉬어가는 공원"
    expect: donggyo_park
    as: jeongheon
  - query: "채식 샌드위치 먹던 단골집"
    expect: plant
    as: jeongheon
  - query: "책 사면 꽃을 주는 서점"
    expect: okeeer
    as: gahyeon
  - query: "화덕에 구운 피자집"
    expect: zootopia
    as: gahyeon
  - query: "양갱 파는 분위기 좋은 카페"
    expect: jeokdang
    as: gahyeon
