# 현행 τ=0.30 판정이 붙인 83행에 대한 적합성 라벨.
#
# **정답 라벨이 없는 문제라 사람이 판정할 수밖에 없다.** 그 판정을 파일로 굳히는 이유는
# 재현이다 — τ 를 바꿔도 같은 라벨로 다시 세고, 다음 사람이 개별 행에 이의를 제기할 수
# 있다. 판정자의 머릿속에만 있으면 τ 를 다시 정할 때 처음부터 다시 봐야 한다.
#
# ## 판정 기준
#
# 각 행은 「이 Context 에 이 키워드가 붙는 것이 맞는가」다. **프리셋의 `description` 을
# 기준으로 삼는다** — 표시명(`display_name`)의 일상적 어감이 아니라 정의된 의미다.
# 예: `QUICK_STOP 간단하게` 의 정의는 "짧게 들르는 방문. 테이크아웃·잠깐 요기하는 상황"
# 이므로 「간단히 맛있었다」 같은 어감은 근거가 되지 않는다.
#
#   fit      프리셋의 정의가 본문에 **명시되거나 직접 함의**된다
#   unfit    본문에 근거가 없다. 장소 종류·통념에서 온 연상이다
#   unclear  통념상 그럴듯하나 본문이 말하지 않는다. 판정자에 따라 갈린다
#
# 두 규칙을 더 둔다. 둘 다 판정 프롬프트(`prompts/keyword_judgment.md`)의 규칙과
# 같은 것이라, 라벨이 프롬프트보다 엄격해져 판정을 부당하게 깎는 일을 막는다.
#
#   부대시설·서비스 언급만으로는 fit 이 아니다 (주차·콘센트 등)
#   COMPANION 계열은 **동행이 실제로 있었는가**를 본다. 「데이트 장소로 좋을 듯」 같은
#   추정은 SITUATION(DATE_COURSE)에는 걸려도 COMPANION(WITH_PARTNER)에는 걸리지 않는다
#
# ## unclear 를 왜 따로 두는가
#
# fit 으로 밀면 τ 상향의 손실이 부풀고, unfit 으로 밀면 이득이 부풀어 **어느 쪽으로 접든
# 결론이 그쪽으로 기운다.** 따로 세고 두 극단을 함께 보고한다(`score.py` 의 낙관·비관 경계).
#
# ## 이 라벨의 한계
#
# 판정자는 이 티켓의 작업자 한 명이고 교차 검증이 없다. **본문이 짧은 실사용자 기록에서
# 특히 흔들린다** — 「가지튀김이 미쳤음」에 무엇이 붙어야 옳은지는 사람마다 다를 수 있다.
# 다만 unfit 으로 표시한 10건은 대부분 장소 종류와 정면으로 어긋나는 것들이라
# (라멘집→디저트, 라멘집→산책) 판정자가 바뀌어도 뒤집힐 여지가 작다고 본다.
#
# context_id 는 2026-07-31 시점 `pinlog-demo`(:15432) 기준이다. 재시딩하면 바뀐다 —
# 그때는 `matrix.py` 를 다시 돌리고 이 파일을 본문 기준으로 다시 맞춰야 한다.

