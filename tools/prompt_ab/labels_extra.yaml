# 재판정에서 새로 나온 행의 적합성 라벨. `S15P11A705-219`.
#
# `tau_grid/labels.yaml` 은 **현행 τ=0.30 판정이 낸 83행만** 덮는다. 판정을 다시 돌리면
# 그 목록에 없는 조합이 나온다 — 판정이 비결정적이기 때문이다(`-210` §4 의 `+9`).
# 그 행들을 빼고 세면 **새로 고른 것이 전부 없는 셈이 되어** 조건 비교가 기운다.
#
# **원본 `labels.yaml` 은 한 줄도 고치지 않았다.** 고치면 `-210` 의 수치와 비교가 끊긴다.
# 기준도 그대로다 — 프리셋 `description` 대조, fit·unfit·unclear 세 값, 부대시설 규칙과
# COMPANION 실동행 규칙. 이 파일은 **커버리지만 넓힌다.**
#
# ## 어떻게 붙였나
#
# `score_ab.py --dump-unlabeled` 로 뽑았다. 그 출력은 **어느 조건이 고른 행인지 찍지
# 않는다** — 보고 붙이면 B 가 새로 고른 것에 후해지고 A 만 고른 것에 박해져, 라벨이
# 결론을 따라간다. 본문과 `description` 만 보고 붙였다.
#
# 같은 본문이 두 `context_id` 로 들어 있는 5쌍(`-210` §4.1)은 **같은 판정을 준다.**
# 한쪽만 다르게 붙으면 그 차이가 조건 효과로 잘못 읽힌다.
#
# ## 이 라벨의 한계
#
# 판정자가 이 티켓의 작업자 한 명이고, **그 작업자가 B 프롬프트를 설계한 사람이기도
# 하다.** 조건을 가리는 것으로 「어느 쪽이 골랐나」는 막았지만 「B 가 노린 유형이
# 무엇인가」는 이미 알고 있다 — 업종·메뉴 연상과 동행 추정이 그것이다. 그 유형에
# 해당하는 행을 unfit 으로 붙이는 데 기울었을 수 있다. 원본 라벨과 마찬가지로 교차
# 검증이 없고, 이 파일 위에 선 수치는 그만큼의 여지를 안고 읽어야 한다.
#
# 다만 20/24 가 **본문에 해당 개념이 한 글자도 없는** 것들이라(라멘집→작업,
# 맛 불평뿐인 글→혼자·활기찬·조용한) 판정자가 바뀌어도 뒤집힐 여지는 작다고 본다.

